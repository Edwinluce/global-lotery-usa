<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<style>
body{background:#080808;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial}
.box{background:#151515;border:1px solid #d8b87a;padding:30px;border-radius:20px;width:90%;max-width:340px}
h2{color:#e9c97a;text-align:center}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2a2a2a;background:#0f0f0f;color:white;box-sizing:border-box}
button{width:100%;padding:14px;background:#e9c97a;border:0;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2>🦁 ADMIN GLOBAL</h2>
<input id="u" placeholder="Usuario" value="Globallotery">
<input id="p" type="password" placeholder="Clave" value="Diosmeama.1">
<button onclick="login()">ENTRAR</button>
<p id="msg" style="color:#ff3b3b;text-align:center"></p>
</div>
<script>
async function login(){
 let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:document.getElementById('u').value,pass:document.getElementById('p').value})});
 let j=await r.json();
 if(j.ok) location.href='/admin'; else document.getElementById('msg').innerText='Clave incorrecta';
}
</script>
</body>
</html>
