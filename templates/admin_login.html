<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Admin Login</title>
<style>body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;color:white;font-family:Arial}.box{background:#222;padding:30px;border-radius:10px;width:300px} input{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:none} button{width:100%;padding:10px;background:#00ff88;border:none;border-radius:5px;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="box">
<h2>Admin Globallotery</h2>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="POST">
<input name="user" placeholder="Usuario" required>
<input name="pass" type="password" placeholder="Clave" required>
<button>Entrar</button>
</form>
</div>
</body></html>
